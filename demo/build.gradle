plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.0'
}

android {
    buildFeatures {
        buildConfig = true
    }
    namespace 'com.zolon.maxstore.emm.demo'
    compileSdk 34

    defaultConfig {
        applicationId APPLICATION_ID
        minSdk 29
        targetSdk 34
        versionCode Integer.parseInt(VERSION_CODE)
        versionName VERSION_NAME

        compileSdkVersion Integer.parseInt(ANDROID_COMPILE_SDK_VERSION)
        buildToolsVersion ANDROID_BUILD_TOOLS_VERSION

        manifestPlaceholders = [
                ACCESS_KEY: "$ACCESS_KEY",
                SECRET: "$SECRET"
        ]

    }


    signingConfigs {
        release {
            // get from gradle.properties
            storeFile file(project.properties['KEYSTORE_FILE'] ?: "debug.keystore")
            storePassword project.properties['KEYSTORE_PASSWORD'] ?: ""
            keyAlias project.properties['KEY_ALIAS'] ?: ""
            keyPassword project.properties['KEY_PASSWORD'] ?: ""
        }
    }


    buildTypes {
        debug {
            buildConfigField "String", "SECRET", "\"$SECRET\""
            resValue "string", "ACCESS_KEY", "$ACCESS_KEY"
            resValue "string", "APP_NAME", "$APP_NAME"
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            signingConfig signingConfigs.release
            buildConfigField "String", "SECRET", "\"$SECRET\""
            resValue "string", "ACCESS_KEY", "$ACCESS_KEY"
            resValue "string", "APP_NAME", "$APP_NAME"
        }
    }

    lintOptions {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            def buildTime = new Date().format("yyyyMMdd-HHmm", TimeZone.getTimeZone("GMT+08:00"))

            outputFileName = "${APP_NAME}-${variant.versionName}-${buildTime}.apk"
        }
    }
}




dependencies {
//    implementation project(':sdk')

    implementation 'com.whatspos.sdk:emm-android-sdk:3.2.1'

    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.0'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.3.0"
}